<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد رمز QR المجاني</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; text-align: center; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #6200ee; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        #qrcode { margin-top: 20px; display: flex; justify-content: center; }
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>أدخل بياناتك الشخصية</h2>
    
    <label for="name" class="visually-hidden">الاسم الكامل</label>
    <input type="text" id="name" placeholder="الاسم الكامل">
    
    <label for="job" class="visually-hidden">الوظيفة</label>
    <input type="text" id="job" placeholder="الوظيفة">
    
    <label for="phone" class="visually-hidden">رقم الهاتف</label>
    <input type="text" id="phone" placeholder="رقم الهاتف">
    
    <label for="email" class="visually-hidden">البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    
    <button type="button" onclick="generateQR()">توليد رمز QR</button>
    
    <div id="qrcode"></div>
</div>

<script>
function generateQR() {
    var container = document.getElementById("qrcode");
    if (!container) return;
    container.innerHTML = "";

    var nameVal = document.getElementById("name").value;
    var jobVal = document.getElementById("job").value;
    var phoneVal = document.getElementById("phone").value;
    var emailVal = document.getElementById("email").value;

    if (!nameVal && !jobVal && !phoneVal && !emailVal) {
        alert("الرجاء إدخال بيانات أولاً!");
        return;
    }

    var qrData = "name=" + encodeURIComponent(nameVal) + 
                 "&job=" + encodeURIComponent(jobVal) + 
                 "&phone=" + encodeURIComponent(phoneVal) + 
                 "&email=" + encodeURIComponent(emailVal);

    new QRCode(container, {
        text: qrData,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });
}
</script>

</body>
</html>
